name: ESP32S3 N16R8 Absolute Bypass Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build_bypass_s3:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Base Linux Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git wget unzip ninja-build cmake flex bison gperf libncurses-dev dfu-util libusb-1.0-0

      - name: Setup Isolated ESP-IDF Framework
        run: |
          git clone --branch release/v5.3 --depth 1 --recursive https://github.com/espressif/esp-idf.git modules/esp_idf
          cd modules/esp_idf
          ./install.sh esp32s3
          echo "IDF_PATH=$GITHUB_WORKSPACE/modules/esp_idf" >> $GITHUB_ENV

      - name: Overwrite Stock Hardware Definitions
        run: |
          DEVKIT_DIR="libraries/AP_HAL_ESP32/boards/esp32s3devkit"
          mkdir -p $DEVKIT_DIR
          
          # Inject an absolute software map that bypasses physical IMU checks
          cat << 'EOF' > $DEVKIT_DIR/hwdef.dat
          # Custom Modified Overrides for Raghavendra's ESP32-S3 N16R8
          MCU ESP32S3
          
          # Initialize the wireless engine subsystem mapping
          RESERVE_WIFI
          HAL_ESP32_WIFI 1
          WIFI_SSID "ardupilot123"
          WIFI_PWD "ardupilot123"
          
          # Map MAVLink telemetry to SERIAL1 (Internal WiFi loop routing)
          SERIAL1_PROTOCOL MAVLink2
          SERIAL1_BAUD 115200
          
          # Isolate SERIAL0 to keep the native USB stream clean
          SERIAL0_PROTOCOL None
          SERIAL0_BAUD 115200
          
          # Force Fallback Drivers (Guarantees "Init Gyro" block is skipped)
          HAL_INS_DEFAULT HAL_INS_NONE
          AP_COMPASS_PROBING_ENABLED 0
          AP_COMPASS_DEFAULT_ENABLED 0
          HAL_BARO_DEFAULT HAL_BARO_NONE
          EOF

      - name: Inject Target Memory Matrix Configuration Settings
        run: |
          TARGET_CONF="libraries/AP_HAL_ESP32/targets/esp32s3/esp-idf/sdkconfig.defaults"
          echo "" >> $TARGET_CONF
          echo "# Force N16R8 OPI Memory Architecture Alignment Rules" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16M=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> $TARGET_CONF
          echo "CONFIG_SPIRAM=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_TYPE_AUTO=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> $TARGET_CONF
          echo "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y" >> $TARGET_CONF

      - name: Execute Build Sequence with Corrected Pipeline Order
        run: |
          . $IDF_PATH/export.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install empy==3.3.4 lxml pymavlink MAVProxy pexpect flake8 geocoder dronecan "pydantic<2.12"
          
          # STEP 1: Deep wipe old workspace configurations
          ./waf clean
          
          # STEP 2: Configure the architecture environment first (Generates the required .waf metadata)
          ./waf configure --board esp32s3devkit
          
          # STEP 3: Now run compilation safely
          ./waf plane
          
          mkdir -p output_binaries
          cp build/esp32s3devkit/esp-idf_build/bootloader/bootloader.bin output_binaries/bootloader.bin
          cp build/esp32s3devkit/esp-idf_build/partition_table/partition-table.bin output_binaries/partition-table.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin output_binaries/ArduPlane.esp32s3n16r8.bin

      - name: Securely Upload Artifact Collection
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-bypass-package
          path: output_binaries/
