name: ESP32S3 N16R8 Secure Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build_esp32s3_n16r8:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Base Linux Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git wget unzip ninja-build cmake flex bison gperf libncurses-dev dfu-util libusb-1.0-0

      - name: Setup Isolated ESP-IDF Framework
        run: |
          git clone --branch release/v5.3 --depth 1 --recursive https://github.com/espressif/esp-idf.git modules/esp_idf
          cd modules/esp_idf
          ./install.sh esp32s3
          echo "IDF_PATH=$GITHUB_WORKSPACE/modules/esp_idf" >> $GITHUB_ENV

      - name: Inject Octal Memory Mappings and Sensor Bypass Rules
        run: |
          # 1. Target configuration file pathway for memory mappings
          TARGET_CONF="libraries/AP_HAL_ESP32/targets/esp32s3/esp-idf/sdkconfig.defaults"
          
          echo "" >> $TARGET_CONF
          echo "# Custom N16R8 Specific Memory and Cache Allocations" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16M=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> $TARGET_CONF
          echo "CONFIG_SPIRAM=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_TYPE_AUTO=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> $TARGET_CONF
          echo "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y" >> $TARGET_CONF
          echo "CONFIG_ESP32S3_DATA_CACHE_64KB=y" >> $TARGET_CONF
          echo "CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y" >> $TARGET_CONF

          # 2. Force the C++ build engine to allow booting without a physical hardware IMU sensor
          TARGET_HEADER="libraries/AP_HAL_ESP32/boards/esp32s3devkit.h"
          if [ -f "$TARGET_HEADER" ]; then
            echo "" >> $TARGET_HEADER
            echo "#undef HAL_INS_DEFAULT" >> $TARGET_HEADER
            echo "#define HAL_INS_DEFAULT HAL_INS_NONE" >> $TARGET_HEADER
            echo "#define AP_COMPASS_PROBING_ENABLED 0" >> $TARGET_HEADER
          fi

      - name: Execute Compilation and Package Core Files
        run: |
          # 1. Source framework environments inside the runner context
          . $IDF_PATH/export.sh
          
          # 2. Install Python dependencies required by Waf/ArduPilot
          python3 -m pip install --upgrade pip
          python3 -m pip install empy==3.3.4 lxml pymavlink MAVProxy pexpect flake8 geocoder dronecan "pydantic<2.12"
          
          # 3. Configure back on the true physical hardware target choice
          ./waf configure --board esp32s3devkit
          
          # 4. Compile ArduPlane target payload
          ./waf plane
          
          # 5. Extract individual operational memory layout blocks into an upload directory
          mkdir -p output_binaries
          cp build/esp32s3devkit/esp-idf_build/bootloader/bootloader.bin output_binaries/bootloader.bin
          cp build/esp32s3devkit/esp-idf_build/partition_table/partition-table.bin output_binaries/partition-table.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin output_binaries/ArduPlane.esp32s3n16r8.bin

      - name: Securely Upload Artifact Collection
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-boot-package
          path: output_binaries/
