name: ESP32S3 N16R8 Active IMU Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build_imu_s3:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Base Linux Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git wget unzip ninja-build cmake flex bison gperf libncurses-dev dfu-util libusb-1.0-0

      - name: Setup Isolated ESP-IDF Framework
        run: |
          git clone --branch release/v5.3 --depth 1 --recursive https://github.com/espressif/esp-idf.git modules/esp_idf
          cd modules/esp_idf
          ./install.sh esp32s3
          echo "IDF_PATH=$GITHUB_WORKSPACE/modules/esp_idf" >> $GITHUB_ENV

      - name: Overwrite Hardware Definitions with Pristine ESP32 Parser Layout
        run: |
          DEVKIT_DIR="libraries/AP_HAL_ESP32/hwdef/esp32s3devkit"
          mkdir -p $DEVKIT_DIR
          
          cat << 'EOF' > $DEVKIT_DIR/hwdef.dat
          define HAL_ESP32_BOARD_NAME "esp32s3devkit"

          # ========================================================================
          # 1. PHYSICAL PERIPHERAL BUS CORES
          # ========================================================================
          ESP32_SPIBUS   SPI3_HOST     SPI_DMA_CH_AUTO  GPIO_NUM_11  GPIO_NUM_13  GPIO_NUM_12
          ESP32_I2CBUS   I2C_NUM_0     GPIO_NUM_16  GPIO_NUM_15  400*KHZ  true     false

          # ========================================================================
          # 2. SPI CHIP SELECTION & PERIPHERAL DRIVERS
          # ========================================================================
          ESP32_SPIDEV   mpu9250       0     0        GPIO_NUM_10  0     1*MHZ    4*MHZ

          IMU Invensense SPI:mpu9250 ROTATION_NONE
          define HAL_INS_DEFAULT HAL_INS_MPU9250_SPI
          define INS_MAX_INSTANCES 3

          define AP_COMPASS_AK8963_ENABLED FALSE
          define AP_COMPASS_PROBING_ENABLED 0

          BARO BMP280 I2C:0:0x77
          define HAL_BARO_ALLOW_INIT_NO_BARO 1

          # ========================================================================
          # 3. PWM MOTOR / SERVO OUTPUTS (RCOUT)
          # ========================================================================
          ESP32_RCOUT GPIO_NUM_1
          ESP32_RCOUT GPIO_NUM_2
          ESP32_RCOUT GPIO_NUM_4
          ESP32_RCOUT GPIO_NUM_5
          ESP32_RCOUT GPIO_NUM_6
          ESP32_RCOUT GPIO_NUM_7

          # ========================================================================
          # 4. RC INPUT HANDLING
          # ========================================================================
          define HAL_ESP32_RCIN GPIO_NUM_14
          define AP_RCPROTOCOL_ENABLED 0
          define HAL_ESP32_RMT_RX_PIN_NUMBER GPIO_NUM_0

          # ========================================================================
          # 5. HIGH LEVEL SYSTEM ARCHITECTURE & TELEMETRY
          # ========================================================================
          ESP32_SERIAL   UART_NUM_0    GPIO_NUM_44  GPIO_NUM_43
          ESP32_SERIAL   UART_NUM_1    GPIO_NUM_17  GPIO_NUM_18

          define HAL_ESP32_WIFI 1
          define WIFI_SSID "ardupilot123"
          define WIFI_PWD "ardupilot123"

          define HAVE_FILESYSTEM_SUPPORT 1
          define HAL_ESP32_SDMMC 1
          define HAL_ESP32_SDCARD 1
          define LOGGER_MAVLINK_SUPPORT 1
          define HAL_OS_POSIX_IO 1
          define HAL_LOGGING_BACKENDS_DEFAULT 1
          EOF

      - name: Inject Target Memory Matrix Configuration Settings
        run: |
          TARGET_CONF="libraries/AP_HAL_ESP32/targets/esp32s3/esp-idf/sdkconfig.defaults"
          echo "" >> $TARGET_CONF
          echo "# Force N16R8 OPI Memory Architecture Alignment Rules" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16M=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> $TARGET_CONF
          echo "CONFIG_SPIRAM=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_TYPE_AUTO=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> $TARGET_CONF
          echo "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y" >> $TARGET_CONF

      - name: Execute Waf Configuration Framework
        run: |
          . $IDF_PATH/export.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install empy==3.3.4 lxml pymavlink MAVProxy pexpect flake8 geocoder dronecan "pydantic<2.12"
          python3 modules/waf/waf-light configure --board esp32s3devkit

      - name: Build Plane Target and Isolate Core App Binaries
        run: |
          . $IDF_PATH/export.sh
          python3 modules/waf/waf-light plane
          
          mkdir -p output_binaries
          
          echo "========================================================"
          echo "        EXTRACTING CHIP FLASHING FRAGMENTS             "
          echo "========================================================"
          
          # Target the specific files directly to bypass metadata overrides
          cp build/esp32s3devkit/esp-idf_build/bootloader/bootloader.bin output_binaries/bootloader.bin
          cp build/esp32s3devkit/esp-idf_build/partition_table/partition-table.bin output_binaries/partition-table.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin output_binaries/ArduPlane.esp32s3n16r8.bin
          
          echo ">>> Extraction complete. Verifying size profiles:"
          echo "--------------------------------------------------------"
          ls -lh output_binaries/
