name: ESP32S3 Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git wget unzip ninja-build cmake flex bison gperf libncurses-dev dfu-util libusb-1.0-0

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install empy==3.3.4 lxml pymavlink MAVProxy pexpect flake8 geocoder dronecan "pydantic<2.12"

      - name: Setup ESP-IDF
        run: |
          git submodule update --init --recursive --depth=1
          ./Tools/scripts/esp32_get_idf.sh
          cd modules/esp_idf
          ./install.sh esp32,esp32s3
          source ./export.sh
          cd ../..

      - name: Build Plane
        run: |
          ./waf configure --board esp32s3devkit
          ./waf plane
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin ArduPlane.esp32s3devkit.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.elf ArduPlane.esp32s3devkit.elf

      - name: Build Copter
        run: |
          ./waf copter
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin ArduCopter.esp32s3devkit.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.elf ArduCopter.esp32s3devkit.elf

      - name: Build Rover
        run: |
          ./waf rover
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin ArduRover.esp32s3devkit.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.elf ArduRover.esp32s3devkit.elf

      - name: Build Sub
        run: |
          ./waf sub
          cp build/esp32s3devkit/esp-idf_build/ardupilot.bin ArduSub.esp32s3devkit.bin
          cp build/esp32s3devkit/esp-idf_build/ardupilot.elf ArduSub.esp32s3devkit.elf

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-binaries
          path: |
            ArduPlane.esp32s3devkit.bin
            ArduPlane.esp32s3devkit.elf
            ArduCopter.esp32s3devkit.bin
            ArduCopter.esp32s3devkit.elf
            ArduRover.esp32s3devkit.bin
            ArduRover.esp32s3devkit.elf
            ArduSub.esp32s3devkit.bin
            ArduSub.esp32s3devkit.elf
