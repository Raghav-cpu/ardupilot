name: ESP32S3 N16R8 Custom Board Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build_custom_s3:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Base Linux Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git wget unzip ninja-build cmake flex bison gperf libncurses-dev dfu-util libusb-1.0-0

      - name: Setup Isolated ESP-IDF Framework
        run: |
          git clone --branch release/v5.3 --depth 1 --recursive https://github.com/espressif/esp-idf.git modules/esp_idf
          cd modules/esp_idf
          ./install.sh esp32s3
          echo "IDF_PATH=$GITHUB_WORKSPACE/modules/esp_idf" >> $GITHUB_ENV

      - name: Inject Custom Hardware Definition (hwdef)
        run: |
          # Create a dedicated hardware profile folder for your custom layout
          mkdir -p libraries/AP_HAL_ESP32/boards/custom_s3
          
          # Write the hardware mapping definition file
          cat << 'EOF' > libraries/AP_HAL_ESP32/boards/custom_s3/hwdef.dat
          # Custom ESP32-S3 N16R8 Board Layout Configuration
          MCU ESP32S3
          
          # Force Serial 0 to bind explicitly to the Wireless Network Endpoint
          RESERVE_WIFI
          HAL_ESP32_WIFI 1
          WIFI_SSID "ardupilot123"
          WIFI_PWD "ardupilot123"
          
          # Map native MAVLink packet execution directly to the network socket
          SERIAL0_PROTOCOL MAVLink2
          SERIAL0_BAUD 115200
          
          # Define the physical SPI Bus pins verified by your Arduino test sketch
          PIN_SPI_SCK  GPIO12
          PIN_SPI_MISO GPIO13
          PIN_SPI_MOSI GPIO11
          
          # Register the physical MPU9250 IMU Sensor directly on SPI Bus 1 with Chip Select 10
          SPIDEV mpu9250 SPI1 DEVICE(0) GPIO10 SPEED(1*MHZ) MODE(3)
          IMU MPU9250 SPI:mpu9250
          
          # Disable unpopulated compass and barometer sensor loops to prevent startup blocks
          AP_COMPASS_PROBING_ENABLED 0
          AP_COMPASS_DEFAULT_ENABLED 0
          HAL_BARO_DEFAULT HAL_BARO_NONE
          EOF

      - name: Inject Target Memory Matrix Parameter Rules
        run: |
          TARGET_CONF="libraries/AP_HAL_ESP32/targets/esp32s3/esp-idf/sdkconfig.defaults"
          echo "" >> $TARGET_CONF
          echo "# Absolute Hardware Overrides for N16R8 Octal Setup" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHMODE_OPI=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16M=y" >> $TARGET_CONF
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"" >> $TARGET_CONF
          echo "CONFIG_SPIRAM=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_TYPE_AUTO=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> $TARGET_CONF
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> $TARGET_CONF
          echo "CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=y" >> $TARGET_CONF

      - name: Execute Compilation against Custom Board
        run: |
          . $IDF_PATH/export.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install empy==3.3.4 lxml pymavlink MAVProxy pexpect flake8 geocoder dronecan "pydantic<2.12"
          
          # Configure Waf to target our custom hardware matrix instead of the devkit defaults
          ./waf configure --board custom_s3
          ./waf plane
          
          mkdir -p output_binaries
          cp build/custom_s3/esp-idf_build/bootloader/bootloader.bin output_binaries/bootloader.bin
          cp build/custom_s3/esp-idf_build/partition_table/partition-table.bin output_binaries/partition-table.bin
          cp build/custom_s3/esp-idf_build/ardupilot.bin output_binaries/ArduPlane.custom_s3.bin

      - name: Securely Upload Artifact Collection
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-custom-package
          path: output_binaries/
