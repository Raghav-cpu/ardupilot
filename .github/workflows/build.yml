name: Build ArduPilot ESP32S3

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y python3-pip git
      - run: |
          wget https://github.com/espressif/crosstool-NG/releases/download/esp-2022r1/xtensa-esp32s3-elf-gcc8_4_0-esp-2022r1-linux-amd64.tar.gz
          tar -xzf xtensa-esp32s3-elf-gcc8_4_0-esp-2022r1-linux-amd64.tar.gz
          echo "$PWD/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
      - run: |
          python3 waf configure --board esp32s3devkit
          python3 waf plane
      - uses: actions/upload-artifact@v4
        with:
          name: plane-esp32s3n16r8
          path: build/esp32s3n16r8/bin/*

  copter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y python3-pip git
      - run: |
          wget https://github.com/espressif/crosstool-NG/releases/download/esp-2022r1/xtensa-esp32s3-elf-gcc8_4_0-esp-2022r1-linux-amd64.tar.gz
          tar -xzf xtensa-esp32s3-elf-gcc8_4_0-esp-2022r1-linux-amd64.tar.gz
          echo "$PWD/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
      - run: |
          python3 waf configure --board esp32s3devkit
          python3 waf copter
      - uses: actions/upload-artifact@v4
        with:
          name: copter-esp32s3n16r8
          path: build/esp32s3n16r8/bin/*

  rover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y python3-pip git
      - run: |
          wget https://github.com/espressif/crosstool-NG/releases/download/esp-2022r1/xtensa-esp32s3-elf-gcc8_4_0-esp-2022r1-linux-amd64.tar.gz
          tar -xzf xtensa-esp32s3-elf-gcc8_4_0-esp-2022r1-linux-amd64.tar.gz
          echo "$PWD/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
      - run: |
          python3 waf configure --board esp32s3devkit
          python3 waf rover
      - uses: actions/upload-artifact@v4
        with:
          name: rover-esp32s3n16r8
          path: build/esp32s3n16r8/bin/*
